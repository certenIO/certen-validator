name: Schema and database tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: certen_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d certen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      CERTEN_TEST_DB: postgres://postgres:postgres@localhost:5432/certen_test?sslmode=disable
      CERTEN_CONTRACTS_DIR: ${{ github.workspace }}/certen-contracts
    steps:
      - uses: actions/checkout@v4
      # certen-contracts is private, and the workflow's own GITHUB_TOKEN reads only this repository: without a credential
      # of its own the checkout failed on every run since it was added (RB5-F48), and the shared execution-commitment
      # vectors the tests compare against were never checked in CI. The CERTEN_CONTRACTS_TOKEN secret is a fine-grained
      # token limited to certenIO/certen-contracts with Contents read-only: it reads that one repository and nothing else.
      - name: Require the certen-contracts read token
        env:
          TOKEN: ${{ secrets.CERTEN_CONTRACTS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret CERTEN_CONTRACTS_TOKEN is not set: add a fine-grained token limited to certenIO/certen-contracts with Contents read-only as this repository's Actions secret CERTEN_CONTRACTS_TOKEN"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: certenIO/certen-contracts
          path: certen-contracts
          token: ${{ secrets.CERTEN_CONTRACTS_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      # Several legacy integration packages share CERTEN_TEST_DB. Run packages serially so each
      # fixture observes a stable catalog and cannot race another package's cleanup.
      - run: go test -p 1 ./... -count=1
