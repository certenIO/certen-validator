## Certen Validator Network - Docker Compose Template
##
## Copy to docker-compose.yml. Nothing secret is written here:
##   - .env.shared (from .env.shared.example): what every validator shares.
##   - secrets/validator-N.env (gitignored, root-only, 0600): what is ONE validator's - ETH_PRIVATE_KEY
##     (its own registered identity; the node refuses to send otherwise - RB3-F64), BLS key material,
##     COMET_PRIVVAL_SEED / COMET_NODE_KEY_SEED (RB3-F95).
##   - POSTGRES_PASSWORD comes from the environment (a .env file next to this one), never a literal.
## Only Sepolia, Base Sepolia and Arbitrum Sepolia are supported chains.

services:
  postgres:
    image: postgres:15-alpine
    container_name: certen-postgres
    environment:
      POSTGRES_DB: certen_proofs
      POSTGRES_USER: certen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certen -d certen_proofs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - certen-net

  validator-1:
    build: .
    container_name: certen-validator-1
    hostname: validator-1
    ports:
      - "8081:8080"
      - "26656:26656"
      - "26657:26657"
    env_file: [.env.shared, secrets/validator-1.env]
    environment:
      VALIDATOR_ID: validator-1
      COMETBFT_P2P_SEEDS: "<COMMA_SEPARATED_PEER_LIST_EXCLUDING_SELF>"
      ATTESTATION_PEERS: "<COMMA_SEPARATED_PEER_LIST_EXCLUDING_SELF>"
    volumes:
      - validator1_data:/app/data
      - validator1_keys:/app/bft-keys
      - ./bls_zk_keys:/app/bls_zk_keys:ro
      - ./bls_zk_keys_bls12381:/app/bls_zk_keys_bls12381:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - certen-net

  # Repeat for validator-2 through validator-7 with:
  #   - Incrementing ports (8082-8087, 26666-26716)
  #   - env_file: [.env.shared, secrets/validator-N.env] - each validator's own keys in its own file
  #   - COMETBFT_P2P_SEEDS excluding self
  #   - ATTESTATION_PEERS excluding self

volumes:
  postgres_data:
  validator1_data:
  validator1_keys:
  # ... validator2 through validator7 volumes

networks:
  certen-net:
    driver: bridge
